<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Direct sum, tensor product, Cartesian product</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #12100c; color: #f3e6c8; font-family: "Palatino Linotype", Palatino, Georgia, serif; }
  #hud { position: fixed; inset: 0 auto auto 0; right: 0; z-index: 2; padding: 18px 22px 8px; pointer-events: none; }
  h1 { margin: 0; font-weight: 500; font-size: 28px; letter-spacing: 0.01em; color: #e4c27a; }
  p.sub { margin: 6px 0 0; color: #cbbfa6; font-size: 14px; max-width: 820px; }
  #bar { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; justify-content: center; padding: 14px 12px 18px; background: linear-gradient(transparent, #12100ce6 30%); }
  button { pointer-events: auto; background: #1c1814; color: #f3e6c8; border: 1px solid #8a7040; border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.active { background: #e4c27a; color: #1a140c; border-color: #e4c27a; }
  #note { position: fixed; z-index: 2; right: 18px; top: 92px; width: min(340px, 34vw); color: #e7dcc4; font-size: 14px; line-height: 1.45; background: #1a1612cc; border: 1px solid #6d5a38; padding: 12px 14px; border-radius: 10px; }
  #c { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="hud">
  <h1>Direct sum, tensor product, or Cartesian product</h1>
  <p class="sub">Drag to orbit. Scroll to zoom. Inaccessible branches add as a direct sum. Coexisting parts multiply as a tensor product. The seven coordinates stay a Cartesian product.</p>
</div>
<div id="note"></div>
<canvas id="c"></canvas>
<div id="bar">
  <button id="b0" class="active" type="button">1 · Direct sum ⊕</button>
  <button id="b1" type="button">2 · Tensor product ⊗</button>
  <button id="b2" type="button">3 · Cartesian product</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x12100c, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x12100c, 14, 32);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
camera.position.set(6.2, 3.4, 8.4);

const amb = new THREE.AmbientLight(0xf0e2c4, 0.45);
const key = new THREE.DirectionalLight(0xffe1a8, 1.15);
key.position.set(4, 8, 6);
const rim = new THREE.DirectionalLight(0x8eb7ff, 0.35);
rim.position.set(-6, 2, -4);
scene.add(amb, key, rim);

const gold = new THREE.MeshStandardMaterial({ color: 0xe4c27a, metalness: 0.35, roughness: 0.42 });
const cream = new THREE.MeshStandardMaterial({ color: 0xf3e6c8, metalness: 0.08, roughness: 0.55, transparent: true, opacity: 0.88 });
const slate = new THREE.MeshStandardMaterial({ color: 0xb7c0c8, metalness: 0.2, roughness: 0.4, transparent: true, opacity: 0.78 });
const ink = new THREE.MeshStandardMaterial({ color: 0x2a241c, metalness: 0.1, roughness: 0.7 });
const membrane = new THREE.MeshStandardMaterial({ color: 0xe4c27a, metalness: 0.15, roughness: 0.35, transparent: true, opacity: 0.38, side: THREE.DoubleSide });

function labelSprite(text) {
  const cnv = document.createElement("canvas");
  cnv.width = 512; cnv.height = 128;
  const g = cnv.getContext("2d");
  g.clearRect(0, 0, 512, 128);
  g.fillStyle = "#f3e6c8";
  g.font = "56px Palatino, Georgia, serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(cnv);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const s = new THREE.Sprite(mat);
  s.scale.set(2.4, 0.6, 1);
  return s;
}

const groups = [new THREE.Group(), new THREE.Group(), new THREE.Group()];
groups.forEach((g, i) => { g.visible = i === 0; scene.add(g); });

// 1. Direct sum: three separated slabs, no bridges
["Hα", "Hβ", "Hγ"].forEach((name, i) => {
  const slab = new THREE.Mesh(new THREE.BoxGeometry(1.15, 2.4, 0.28), slate.clone());
  slab.position.set((i - 1) * 2.15, 0.2, 0);
  groups[0].add(slab);
  const lab = labelSprite(name);
  lab.position.set((i - 1) * 2.15, 1.85, 0);
  groups[0].add(lab);
});
const forbid = labelSprite("no cross-observables");
forbid.position.set(0, -1.85, 0);
groups[0].add(forbid);

// 2. Tensor product: stacked coexisting factors
const layers = [
  { name: "external", y: -1.05, mat: slate },
  { name: "blanket", y: 0.0, mat: membrane },
  { name: "internal", y: 1.05, mat: cream }
];
layers.forEach((L) => {
  const box = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.72, 2.2), L.mat.clone());
  box.position.y = L.y;
  groups[1].add(box);
  const lab = labelSprite(L.name);
  lab.position.set(0, L.y + 0.55, 1.35);
  groups[1].add(lab);
});

// 3. Cartesian product: seven axes from a shared origin
const axes = [
  ["P", [0, 2.3, 0]],
  ["B", [-2.1, 0.4, 0]],
  ["T", [2.1, 0.4, 0]],
  ["ρ", [1.3, 1.5, 0.6]],
  ["σ", [-1.3, 1.5, 0.6]],
  ["CI_B", [-1.2, -1.3, 0.4]],
  ["λ", [1.2, -1.3, 0.4]]
];
const origin = new THREE.Mesh(new THREE.SphereGeometry(0.08, 24, 16), gold);
groups[2].add(origin);
axes.forEach(([name, pos]) => {
  const dir = new THREE.Vector3(...pos);
  const len = dir.length();
  const arrow = new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(0, 0, 0), len, 0xe4c27a, 0.18, 0.1);
  groups[2].add(arrow);
  const lab = labelSprite(name);
  lab.position.copy(dir.clone().multiplyScalar(1.12));
  groups[2].add(lab);
});

const floor = new THREE.Mesh(new THREE.CircleGeometry(7.5, 64), new THREE.MeshStandardMaterial({ color: 0x1a1612, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.2;
scene.add(floor);

const notes = [
  "Direct sum ⊕. Mutually inaccessible branches are sectors Hα ⊕ Hβ ⊕ Hγ. The admissible state is a block-diagonal mixture. A coherent sum would interfere, so it is excluded. Dimensions add.",
  "Tensor product ⊗. Use this only for coexisting parts: internal ⊗ blanket ⊗ external. Boundary failure is dependence across internal and external. Do not tensor alternative branches.",
  "Cartesian product. The seven coordinates are intervals, not subsystems. Tangents form a direct sum of lines. Tensoring those one-dimensional axes collapses the state to a single line."
];
const note = document.getElementById("note");
note.textContent = notes[0];

let mode = 0;
function setMode(i) {
  mode = i;
  groups.forEach((g, k) => g.visible = k === i);
  document.querySelectorAll("#bar button").forEach((b, k) => b.classList.toggle("active", k === i));
  note.textContent = notes[i];
}
["b0", "b1", "b2"].forEach((id, i) => document.getElementById(id).onclick = () => setMode(i));

let dragging = false, lx = 0, ly = 0, theta = 0.55, phi = 0.42, radius = 11;
canvas.addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", (e) => {
  if (!dragging) return;
  theta -= (e.clientX - lx) * 0.008;
  phi = Math.max(0.15, Math.min(1.25, phi - (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener("wheel", (e) => { radius = Math.max(6, Math.min(18, radius + Math.sign(e.deltaY) * 0.4)); e.preventDefault(); }, { passive: false });
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function tick(t) {
  groups.forEach((g) => { if (g.visible) g.rotation.y = Math.sin(t * 0.00015) * 0.08; });
  camera.position.set(radius * Math.sin(theta) * Math.cos(phi), radius * Math.sin(phi) * 0.72 + 0.4, radius * Math.cos(theta) * Math.cos(phi));
  camera.lookAt(0, 0.1, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
